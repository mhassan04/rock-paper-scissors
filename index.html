
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>

        let humanScore = 0;
        let computerScore = 0;
        // ** ROCK BUTTON ** //
        const rock = document.createElement("button");
        rock.textContent = "Rock";
        rock.addEventListener("click", function(){
            playRound('rock', getComputerChoice());
        })
        document.body.appendChild(rock);

        // ** PAPER BUTTON ** //
        const paper = document.createElement("button");
        paper.textContent = "Paper";
        paper.addEventListener("click", function(){
            playRound('paper', getComputerChoice());

        })
        document.body.appendChild(paper);

        // ** SCISSORS BUTTON ** //
        const scissors = document.createElement("button");
        scissors.textContent = "Scissors";
        scissors.addEventListener("click", function(){
            playRound('scissors', getComputerChoice());
        })
        document.body.appendChild(scissors);

        // * TRACK SCORE ** //
        const trackScore = document.createElement("div");
        document.body.appendChild(trackScore);

        // ** ROUNDS RESULT ** //
        const roundResult = document.createElement("div");
        document.body.appendChild(roundResult);

        // ** GAME OVER MESSAGE ** //

        const gameOverMessage = document.createElement("div");
        document.body.appendChild(gameOverMessage);


        function getComputerChoice(){
        let decision = Math.random();
        if(decision > 0 && decision <= 0.33 ){
            return "rock";
        }
        else if(decision >= 0.34 && decision <= 0.66 ){
            return "paper";
        }
        else if(decision >= 0.67 && decision <= 1 ){
            return "scissors";
        }
    }

    function playRound(humanChoice, computerChoice){

        // ** CHECKS IF GAME ALREADY OVER ** //

        if(humanScore == 5 || computerScore == 5){
            return; 
        }
    
        computerChoice = computerChoice.toLowerCase();


        if(computerChoice ==  humanChoice){
           roundResult.textContent = "This is a tie!"
        }
        else if(computerChoice == "rock" && humanChoice == "paper"){
            roundResult.textContent = "Paper beats Rock. You win!"
            humanScore++;
        }
        else if(computerChoice == "rock" && humanChoice == "scissors"){
            roundResult.textContent = "Rock beats Scissors. You lose!"
            computerScore++;
        }
        else if(computerChoice == "paper" && humanChoice == "rock"){
            roundResult.textContent = "Paper beats Rock. You lose!";
            computerScore++;
        }
        else if(computerChoice == "paper" && humanChoice == "scissors"){ 
            roundResult.textContent = "Scissors beats Paper. You win!"
            humanScore++;
        }
        else if(computerChoice == "scissors" && humanChoice == "rock"){
            roundResult.textContent = "Rock beats Scissors. You win!"
            humanScore++;
        }
        else if(computerChoice == "scissors" && humanChoice == "paper"){
            roundResult.textContent = "Scissors beats Paper. You lose!";
            computerScore++;
        }
        trackScore.textContent = `You: ${humanScore} - Computer: ${computerScore}`;
        
        if (humanScore == 5){
            roundResult.textContent = `Final Score: You: ${humanScore} - Computer: ${computerScore}`;
            gameOverMessage.textContent = "Game Over! You Win."
        }
        else if(computerScore == 5){
            roundResult.textContent = `Final Score: You: ${humanScore} - Computer: ${computerScore}`;
            gameOverMessage.textContent = "Game Over! Computer Wins."
        }
    }
    </script>
</body>
</html>
